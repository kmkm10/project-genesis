<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究者コピー展示 - Project Genesis</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/copies.css">
</head>

<body>
    <div id="copy-container">
        <header>
            <h1>研究者コピー展示</h1>
            <div class="header-info">
                <div class="user-info">
                    <span>ようこそ, <strong>{{ session.username }}</strong> さん</span>
                    <a href="{{ url_for('index') }}" class="back-btn">ゲームに戻る</a>
                    <a href="{{ url_for('logout') }}" class="logout-btn">ログアウト</a>
                </div>
            </div>
        </header>

        <main>
            <div class="copy-controls">
                <button id="add-copy-btn" class="primary-btn">新しいコピーを追加</button>
                <div class="filter-controls">
                    <label for="category-filter">カテゴリー:</label>
                    <select id="category-filter">
                        <option value="all">すべて</option>
                        <option value="製品">製品</option>
                        <option value="サービス">サービス</option>
                        <option value="広告">広告</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
            </div>

            <div id="copies-grid" class="copies-grid">
                <!-- Copies will be loaded here dynamically -->
            </div>
        </main>
    </div>

    <!-- Add Copy Modal -->
    <div id="add-copy-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>新しいコピーを追加</h2>
            <form id="add-copy-form">
                <div class="form-group">
                    <label for="copy-title">タイトル:</label>
                    <input type="text" id="copy-title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="copy-category">カテゴリー:</label>
                    <select id="copy-category" name="category">
                        <option value="">未分類</option>
                        <option value="製品">製品</option>
                        <option value="サービス">サービス</option>
                        <option value="広告">広告</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="copy-text">コピー本文:</label>
                    <textarea id="copy-text" name="copy_text" rows="6" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="primary-btn">追加</button>
                    <button type="button" class="cancel-btn">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/copies.js"></script>
</body>

</html>
